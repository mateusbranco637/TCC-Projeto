    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Helpers ---

        // Máscara simples de CPF: 000.000.000-00
        function maskCPF(value) {
            return value
                .replace(/\D/g, '')
                .slice(0, 11)
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        }

        function maskPhone(value) {
            return value
                .replace(/\D/g, '')
                .slice(0, 11)
                .replace(/(\d{2})(\d)/, '($1) $2')
                .replace(/(\d{5})(\d)/, '$1-$2');
        }

        // --- WebRTC / Chamada automatica ---
        // Prefixo usado para transformar o "id" de cada pessoa (ex: '1', 'c1')
        // em um Peer ID previsível no PeerJS. Isso elimina a necessidade de
        // copiar/colar manualmente o ID gerado pelo PeerJS a cada chamada.
        const PEER_PREFIX = 'psicompany-';
        function toPeerId(id) {
            return `${PEER_PREFIX}${id}`;
        }

        // Descobre o "id" do usuário logado nesta aba/dispositivo.
        // Em produção isso viria do backend (ex: id do usuário autenticado).
        // Aqui, para permitir testar duas contas em duas abas sem precisar
        // digitar nada, aceitamos um parâmetro de URL (?asId=1) e, na falta
        // dele, geramos algo estável a partir do nome informado no cadastro.
        function getOwnId(formData, usuario) {
            const params = new URLSearchParams(window.location.search);
            const fromUrl = params.get('asId');
            if (fromUrl) return fromUrl;
            // Prefere o id real do usuário autenticado (vindo do backend); cai para o nome digitado como último recurso.
            if (usuario?.id) return usuario.id;
            const base = (formData?.user || 'anon').toLowerCase().replace(/[^a-z0-9]/g, '') || 'anon';
            return base;
        }

        };

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const src = ICON_IMAGES[name];
            if (!src) return null;
            return <img src={src} alt={name} className={`inline-block rounded-full object-cover ${className}`} />;
        };

        const InputField = ({ label, value, onChange, placeholder, type = "text", icon, name }) => (
            <div className="space-y-1 text-left">
                <label className="text-sm font-semibold text-pastel-green-600 ml-1">{label}</label>
                <div className="relative group">
                    <div className="absolute left-3 top-1/2 -translate-y-1/2 text-pastel-green-400 group-focus-within:text-pastel-green-600 transition-colors">
                        <Icon name={icon} className="w-4 h-4" />
                    </div>
                    <input
                        type={type}
                        name={name}
                        value={value}
                        onChange={onChange}
                        placeholder={placeholder}
                        className="w-full pl-10 pr-4 py-2.5 bg-white border border-pastel-green-100 rounded-xl outline-none focus:ring-2 focus:ring-pastel-green-200 transition-all text-sm"
                        required
                    />
                </div>
            </div>
        );

        // --- API (backend Node.js/Express + PostgreSQL) ---

        // Ajuste este endereço se o backend estiver rodando em outra porta/host.
        const API_BASE = window.PSICOMPANY_API_BASE || 'http://localhost:3000/api';

        async function apiFetch(path, { token, ...options } = {}) {
            const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
            if (token) headers.Authorization = `Bearer ${token}`;

            const resp = await fetch(`${API_BASE}${path}`, { ...options, headers });
            let data = null;
            try { data = await resp.json(); } catch (e) { /* resposta sem corpo */ }

            if (!resp.ok) {
                const mensagem = data?.erro || `Erro ${resp.status} ao chamar ${path}`;
                throw new Error(mensagem);
            }
            return data;
        }

        // Papel usado na tela (client/psychologist) -> papel usado pela API (paciente/psicologo)
        const ROLE_TO_PAPEL = { client: 'paciente', psychologist: 'psicologo' };

        // --- Main App ---

        function App() {
            const [step, setStep] = useState('landing'); // landing, register, preferences, dashboard, chat, video
            const [role, setRole] = useState(null);
            const [authMode, setAuthMode] = useState('register'); // 'register' | 'login'
            const [formData, setFormData] = useState({
                user: '', email: '', phone: '', cpf: '', senha: '', nascimento: '', crp: '',
            });
            const [preferences, setPreferences] = useState([]);
            const [selectedPerson, setSelectedPerson] = useState(null);

            const [token, setToken] = useState(null);
            const [usuario, setUsuario] = useState(null);
            const [erroForm, setErroForm] = useState('');
            const [carregando, setCarregando] = useState(false);

            const [psicologos, setPsicologos] = useState([]);
            const [pacientes, setPacientes] = useState([]);
            const [consultas, setConsultas] = useState([]);

            // --- Handlers ---
            const handleFieldChange = (field) => (e) => {
                let value = e.target.value;
                if (field === 'cpf') value = maskCPF(value);
                if (field === 'phone') value = maskPhone(value);
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            // Busca as listas relevantes ao entrar no dashboard
            const carregarDashboard = async (tok, papel) => {
                try {
                    if (papel === 'paciente') {
                        const lista = await apiFetch('/psicologos', { token: tok });
                        setPsicologos(lista);
                    } else {
                        const lista = await apiFetch('/pacientes', { token: tok });
                        setPacientes(lista);
                    }
                    const minhasConsultas = await apiFetch('/consultas/minhas', { token: tok });
                    setConsultas(minhasConsultas);
                } catch (err) {
                    setErroForm(err.message);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setErroForm('');
                setCarregando(true);
                const papel = ROLE_TO_PAPEL[role];

                try {
                    if (authMode === 'login') {
                        const resp = await apiFetch('/auth/login', {
                            method: 'POST',
                            body: JSON.stringify({ email: formData.email, senha: formData.senha, papel }),
                        });
                        setToken(resp.token);
                        setUsuario(resp.usuario);
                        await carregarDashboard(resp.token, papel);
                        setStep('dashboard');
                        return;
                    }

                    const corpo = papel === 'paciente'
                        ? {
                            nome: formData.user,
                            data_nascimento: formData.nascimento,
                            cpf: formData.cpf,
                            email: formData.email,
                            telefone: formData.phone,
                            senha: formData.senha,
                        }
                        : {
                            nome: formData.user,
                            data_nascimento: formData.nascimento,
                            cpf_cnpj: formData.cpf,
                            numero_crp: formData.crp,
                            telefone: formData.phone,
                            email: formData.email,
                            senha: formData.senha,
                        };

                    const rota = papel === 'paciente' ? '/auth/registro/paciente' : '/auth/registro/psicologo';
                    const resp = await apiFetch(rota, { method: 'POST', body: JSON.stringify(corpo) });

                    setToken(resp.token);
                    setUsuario(resp.usuario);
                    setStep('preferences');
                } catch (err) {
                    setErroForm(err.message);
                } finally {
                    setCarregando(false);
                }
            };

            const handleAgendar = async (psicologoId) => {
                const dataHora = window.prompt('Data e hora da consulta (AAAA-MM-DDTHH:MM), ex: 2026-09-10T15:00');
                if (!dataHora) return;
                try {
                    await apiFetch('/consultas', {
                        method: 'POST',
                        token,
                        body: JSON.stringify({ psicologo_id: psicologoId, data_hora: dataHora }),
                    });
                    const minhasConsultas = await apiFetch('/consultas/minhas', { token });
                    setConsultas(minhasConsultas);
                    window.alert('Consulta agendada!');
                } catch (err) {
                    window.alert(err.message);
                }
            };

            const handleStatusConsulta = async (consultaId, status) => {
                try {
                    await apiFetch(`/consultas/${consultaId}/status`, {
                        method: 'PATCH',
                        token,
                        body: JSON.stringify({ status }),
                    });
                    const minhasConsultas = await apiFetch('/consultas/minhas', { token });
                    setConsultas(minhasConsultas);
                } catch (err) {
                    window.alert(err.message);
                }
            };

            // --- Views ---

            // 1. Landing (Role Selection)
            if (step === 'landing') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 pastel-gradient">
                        <div className="max-w-4xl w-full grid md:grid-cols-2 gap-8 animate_animated animate_fadeIn">
                            <div className="flex flex-col justify-center space-y-6 text-center md:text-left">
                                <div className="flex items-center gap-2 justify-center md:justify-start">
                                    <div className="p-2 bg-pastel-green-500 rounded-2xl text-white shadow-lg shadow-pastel-green-200">
                                        <Icon name="brain" className="w-8 h-8" />
                                    </div>
                                    <h1 className="text-4xl font-serif text-pastel-green-600">PsiCompany</h1>
                                </div>
                                <h2 className="text-5xl font-extrabold text-slate-800 leading-tight">
                                    seu aplicativo de atendimento psicologico <span className="text-pastel-green-500 italic"> rapido e pratico</span>
                                </h2>
                            </div>

                            <div className="bg-white/60 backdrop-blur-md p-8 rounded-[40px] shadow-2xl border border-white flex flex-col justify-center space-y-6">
                                <h3 className="text-xl font-bold text-center text-slate-700">Selecione seu acesso:</h3>
                                <button
                                    onClick={() => { setRole('client'); setStep('register'); }}
                                    className="group relative bg-white p-6 rounded-3xl border border-pastel-green-50 shadow-sm hover:shadow-xl hover:bg-pastel-green-500 transition-all duration-500 text-left overflow-hidden"
                                >
                                    <div className="relative z-10">
                                        <div className="w-12 h-12 bg-pastel-green-100 rounded-2xl flex items-center justify-center text-pastel-green-600 group-hover:bg-white group-hover:text-pastel-green-500 transition-all">
                                            <Icon name="user" />
                                        </div>
                                        <h4 className="mt-4 font-bold text-xl text-slate-800 group-hover:text-white transition-all">Sou Paciente</h4>
                                        <p className="text-sm text-slate-400 group-hover:text-pastel-green-50 transition-all">Busco apoio e orientação profissional.</p>
                                    </div>
                                    <div className="absolute -right-4 -bottom-4 w-24 h-24 bg-pastel-green-400/20 rounded-full group-hover:scale-150 transition-all duration-700"></div>
                                </button>

                                <button
                                    onClick={() => { setRole('psychologist'); setStep('register'); }}
                                    className="group relative bg-white p-6 rounded-3xl border border-pastel-green-50 shadow-sm hover:shadow-xl hover:bg-indigo-500 transition-all duration-500 text-left overflow-hidden"
                                >
                                    <div className="relative z-10">
                                        <div className="w-12 h-12 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-600 group-hover:bg-white group-hover:text-indigo-500 transition-all">
                                            <Icon name="briefcase" />
                                        </div>
                                        <h4 className="mt-4 font-bold text-xl text-slate-800 group-hover:text-white transition-all">Sou Psicólogo</h4>
                                        <p className="text-sm text-slate-400 group-hover:text-indigo-50 transition-all">Desejo oferecer meus serviços e ajudar.</p>
                                    </div>
                                    <div className="absolute -right-4 -bottom-4 w-24 h-24 bg-indigo-400/20 rounded-full group-hover:scale-150 transition-all duration-700"></div>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // 2. Register / Login Form
            if (step === 'register') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-pastel-green-50">
                        <div className="max-w-md w-full bg-white p-10 rounded-[40px] shadow-2xl space-y-6 animate_animated animate_zoomIn">
                            <button onClick={() => { setStep('landing'); setErroForm(''); }} className="text-pastel-green-400 hover:text-pastel-green-600 flex items-center gap-2 text-sm font-bold transition-all">
                                <Icon name="arrow-left" className="w-4 h-4" /> Voltar
                            </button>
                            <div className="text-center space-y-2">
                                <h2 className="text-3xl font-extrabold text-slate-800">
                                    {authMode === 'register' ? 'Crie sua conta' : 'Entrar na sua conta'}
                                </h2>
                            </div>

                            {erroForm && (
                                <div className="bg-rose-50 text-rose-600 text-sm font-semibold rounded-2xl px-4 py-3 text-center">
                                    {erroForm}
                                </div>
                            )}

                            <form onSubmit={handleRegister} className="space-y-4">
                                {authMode === 'register' && (
                                    <>
                                        <InputField label="Nome de Usuário" name="user" icon="user" placeholder="Como quer ser chamado?" value={formData.user} onChange={handleFieldChange('user')} />
                                        <InputField label="Data de Nascimento" name="nascimento" icon="cpf" type="date" value={formData.nascimento} onChange={handleFieldChange('nascimento')} />
                                    </>
                                )}
                                <InputField label="Email" name="email" icon="mail" type="email" placeholder="seu@email.com" value={formData.email} onChange={handleFieldChange('email')} />
                                {authMode === 'register' && (
                                    <>
                                        <InputField label="Telefone" name="phone" icon="phone" placeholder="(00) 00000-0000" value={formData.phone} onChange={handleFieldChange('phone')} />
                                        <InputField
                                            label={role === 'psychologist' ? 'CPF ou CNPJ' : 'CPF'}
                                            name="cpf" icon="cpf"
                                            placeholder={role === 'psychologist' ? 'Somente números' : '000.000.000-00'}
                                            value={formData.cpf}
                                            onChange={role === 'psychologist' ? (e) => setFormData(prev => ({ ...prev, cpf: e.target.value.replace(/\D/g, '') })) : handleFieldChange('cpf')}
                                        />
                                        {role === 'psychologist' && (
                                            <InputField label="Número do CRP" name="crp" icon="briefcase" placeholder="Ex: 06/123456" value={formData.crp} onChange={handleFieldChange('crp')} />
                                        )}
                                    </>
                                )}
                                <InputField label="Senha" name="senha" icon="user" type="password" placeholder="Mínimo 6 caracteres" value={formData.senha} onChange={handleFieldChange('senha')} />

                                <button type="submit" disabled={carregando} className="w-full bg-pastel-green-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-pastel-green-100 hover:bg-pastel-green-600 hover:scale-[1.02] transition-all active:scale-95 mt-4 disabled:opacity-50">
                                    {carregando ? 'Enviando...' : (authMode === 'register' ? 'Continuar' : 'Entrar')}
                                </button>
                            </form>

                            <button
                                onClick={() => { setAuthMode(authMode === 'register' ? 'login' : 'register'); setErroForm(''); }}
                                className="w-full text-center text-sm font-semibold text-slate-400 hover:text-pastel-green-600 transition-all"
                            >
                                {authMode === 'register' ? 'Já tem conta? Entrar' : 'Ainda não tem conta? Cadastre-se'}
                            </button>
                        </div>
                    </div>
                );
            }

            // 3. Preferences Selection
            if (step === 'preferences') {
                const options = role === 'client'
                    ? ["Ansiedade", "Depressão", "Terapia de Casal", "Luto", "Desenvolvimento Pessoal", "Autoestima"]
                    : ["Crianças", "Adolescentes", "Adultos", "Casais", "Famílias"];

                return (
                    <div className="min-h-screen flex items-center justify-center p-6 pastel-gradient">
                        <div className="max-w-2xl w-full bg-white/90 backdrop-blur-xl p-10 rounded-[50px] shadow-2xl text-center space-y-8 animate_animated animate_fadeInUp">
                            <h2 className="text-3xl font-extrabold text-slate-800">
                                {role === 'client' ? 'O que você está buscando?' : 'Qual seu foco de atendimento?'}
                            </h2>
                            <p className="text-slate-500">Selecione as áreas de maior interesse para personalizarmos sua experiência.</p>

                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                {options.map(opt => (
                                    <button
                                        key={opt}
                                        onClick={() => {
                                            setPreferences(prev => prev.includes(opt) ? prev.filter(p => p !== opt) : [...prev, opt]);
                                        }}
                                        className={`p-4 rounded-2xl border-2 font-bold transition-all duration-300 ${
                                            preferences.includes(opt)
                                                ? 'bg-pastel-green-500 border-pastel-green-500 text-white shadow-lg shadow-pastel-green-200'
                                                : 'bg-white border-pastel-green-50 text-slate-600 hover:border-pastel-green-200'
                                        }`}
                                    >
                                        {opt}
                                    </button>
                                ))}
                            </div>

                            <button
                                onClick={async () => { await carregarDashboard(token, ROLE_TO_PAPEL[role]); setStep('dashboard'); }}
                                disabled={preferences.length === 0}
                                className="px-12 py-4 bg-slate-800 text-white rounded-2xl font-bold hover:bg-slate-900 transition-all disabled:opacity-30"
                            >
                                Finalizar e Entrar
                            </button>
                        </div>
                    </div>
                );
            }

            // 4. Dashboards (LinkedIn Style for Psych, Regular for Client)
            if (step === 'dashboard') {
                const nomeExibido = usuario?.nome || formData.user || 'Seu Perfil';
                const avatarSeed = nomeExibido || role || 'user';
                const listaPessoas = role === 'client' ? psicologos : pacientes;
                const ehPaciente = role === 'client';
                return (
                    <div className="min-h-screen bg-slate-50">
                        <nav className="sticky top-0 z-20 bg-white/80 backdrop-blur-lg border-b border-pastel-green-50 px-8 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="p-1.5 bg-pastel-green-500 rounded-xl text-white">
                                    <Icon name="brain" className="w-5 h-5" />
                                </div>
                                <span className="text-xl font-bold text-pastel-green-600">PsiCompany</span>
                            </div>
                            <div className="flex items-center gap-6">
                                <button className="text-slate-400 hover:text-pastel-green-500 transition-colors"><Icon name="bell" /></button>
                                <button className="text-slate-400 hover:text-pastel-green-500 transition-colors"><Icon name="message-circle" /></button>
                                <div className="w-10 h-10 rounded-full bg-pastel-green-100 border-2 border-white shadow-sm overflow-hidden">
                                    <img src={`https://api.dicebear.com/7.x/avataaars/svg?seed=${avatarSeed}`} alt="Perfil" />
                                </div>
                            </div>
                        </nav>

                        <main className="max-w-6xl mx-auto p-8 grid md:grid-cols-4 gap-8">
                            {/* Left Sidebar Profile Info */}
                            <div className="md:col-span-1 space-y-6">
                                <div className="bg-white rounded-3xl p-6 shadow-sm border border-pastel-green-50 text-center animate_animated animate_fadeInLeft">
                                    <div className="w-24 h-24 rounded-full mx-auto bg-pastel-green-100 p-1 mb-4">
                                        <img src={`https://api.dicebear.com/7.x/avataaars/svg?seed=${avatarSeed}`} alt="Seu avatar" className="rounded-full" />
                                    </div>
                                    <h3 className="font-bold text-lg">{nomeExibido}</h3>
                                    <div className="mt-6 pt-6 border-t border-slate-50 flex justify-around">
                                        <div><p className="text-xl font-bold">{consultas.length}</p><p className="text-[10px] text-slate-400 uppercase">Sessões</p></div>
                                        <div><p className="text-xl font-bold">4.9</p><p className="text-[10px] text-slate-400 uppercase">Nota</p></div>
                                    </div>
                                </div>
                            </div>

                            {/* Main Feed Content */}
                            <div className="md:col-span-3 space-y-8 animate_animated animate_fadeInUp">
                                <div className="bg-pastel-green-500 p-8 rounded-[40px] text-white flex justify-between items-center relative overflow-hidden shadow-2xl shadow-pastel-green-200">
                                    <div className="relative z-10">
                                        <h2 className="text-3xl font-bold">{ehPaciente ? 'Profissionais disponíveis' : 'Seus pacientes'}</h2>
                                        <p className="opacity-80 mt-2">Baseado em sua busca por: <span className="font-bold underline">{preferences[0]}</span></p>
                                    </div>
                                    <div className="relative z-10 bg-white/20 p-4 rounded-2xl backdrop-blur-md">
                                        <Icon name="sparkles" className="w-8 h-8" />
                                    </div>
                                    <div className="absolute right-0 top-0 w-64 h-64 bg-white/10 rounded-full -mr-20 -mt-20 scale-150"></div>
                                </div>

                                {erroForm && (
                                    <div className="bg-rose-50 text-rose-600 text-sm font-semibold rounded-2xl px-4 py-3">
                                        {erroForm}
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {listaPessoas.length === 0 && (
                                        <p className="text-slate-400 text-sm col-span-2">
                                            {ehPaciente ? 'Nenhum profissional cadastrado ainda.' : 'Você ainda não tem pacientes vinculados a consultas.'}
                                        </p>
                                    )}
                                    {listaPessoas.map(person => (
                                        <div key={person.id} className="bg-white p-6 rounded-[32px] shadow-sm border border-pastel-green-50 flex flex-col items-center text-center card-hover">
                                            <div className="w-20 h-20 bg-slate-100 rounded-3xl mb-4 overflow-hidden">
                                                <img src={`https://api.dicebear.com/7.x/avataaars/svg?seed=${person.id}`} alt={person.nome} />
                                            </div>
                                            <h4 className="font-bold text-xl">{person.nome}</h4>
                                            {ehPaciente && <p className="text-pastel-green-500 font-bold text-sm mb-3">{person.especialidade || 'Psicólogo(a)'}</p>}
                                            <p className="text-slate-400 text-sm mb-6 line-clamp-2">
                                                {person.bio || (ehPaciente ? 'Profissional cadastrado na plataforma.' : `Contato: ${person.email || person.telefone}`)}
                                            </p>

                                            <div className="flex gap-3 w-full">
                                                <button
                                                    onClick={() => { setSelectedPerson(person); setStep('chat'); }}
                                                    className="flex-1 py-3 bg-pastel-green-50 text-pastel-green-600 rounded-2xl font-bold hover:bg-pastel-green-500 hover:text-white transition-all"
                                                >
                                                    Mensagem
                                                </button>
                                                <button
                                                    onClick={() => { setSelectedPerson(person); setStep('video'); }}
                                                    className="w-14 h-14 bg-slate-800 text-white rounded-2xl flex items-center justify-center hover:bg-slate-900 transition-all"
                                                >
                                                    <Icon name="video" />
                                                </button>
                                                {ehPaciente && (
                                                    <button
                                                        onClick={() => handleAgendar(person.id)}
                                                        className="px-4 py-3 bg-indigo-500 text-white rounded-2xl font-bold hover:bg-indigo-600 transition-all text-sm"
                                                    >
                                                        Agendar
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* Minhas consultas */}
                                <div className="bg-white rounded-[32px] p-8 shadow-sm border border-pastel-green-50">
                                    <h3 className="font-bold text-xl mb-4">Minhas consultas</h3>
                                    {consultas.length === 0 && <p className="text-slate-400 text-sm">Nenhuma consulta agendada.</p>}
                                    <div className="space-y-3">
                                        {consultas.map(c => (
                                            <div key={c.id} className="flex flex-wrap justify-between items-center gap-3 border border-slate-50 rounded-2xl p-4">
                                                <div>
                                                    <p className="font-bold">
                                                        {ehPaciente ? c.psicologo_nome : c.paciente_nome}
                                                    </p>
                                                    <p className="text-sm text-slate-400">
                                                        {new Date(c.data_hora).toLocaleString('pt-BR')} · status: {c.status}
                                                    </p>
                                                </div>
                                                <div className="flex gap-2">
                                                    {!ehPaciente && c.status === 'agendada' && (
                                                        <button onClick={() => handleStatusConsulta(c.id, 'confirmada')} className="px-3 py-2 text-xs font-bold rounded-xl bg-pastel-green-100 text-pastel-green-700 hover:bg-pastel-green-500 hover:text-white transition-all">Confirmar</button>
                                                    )}
                                                    {!ehPaciente && c.status === 'confirmada' && (
                                                        <button onClick={() => handleStatusConsulta(c.id, 'concluida')} className="px-3 py-2 text-xs font-bold rounded-xl bg-slate-800 text-white hover:bg-slate-900 transition-all">Concluir</button>
                                                    )}
                                                    {c.status !== 'cancelada' && c.status !== 'concluida' && (
                                                        <button onClick={() => handleStatusConsulta(c.id, 'cancelada')} className="px-3 py-2 text-xs font-bold rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-500 hover:text-white transition-all">Cancelar</button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                );
            }

            if (step === 'chat') {
                return <ChatView person={selectedPerson} onBack={() => setStep('dashboard')} />;
            }

            if (step === 'video') {
                return <VideoView person={selectedPerson} formData={formData} usuario={usuario} onBack={() => setStep('dashboard')} />;
            }
        }

        // --- Chat & Video Components ---

        function ChatView({ person, onBack }) {
            const [msg, setMsg] = useState('');
            const [history, setHistory] = useState([
                { id: 1, text: 'Olá! Como você está se sentindo hoje?', sender: 'other' }
            ]);

            const send = (e) => {
                e.preventDefault();
                if (!msg.trim()) return;
                setHistory(prev => [...prev, { id: Date.now(), text: msg, sender: 'me' }]);
                setMsg('');
                setTimeout(() => {
                    setHistory(prev => [...prev, { id: Date.now() + 1, text: "Entendo. Podemos conversar mais sobre isso na nossa vídeo?", sender: 'other' }]);
                }, 1000);
            };

            return (
                <div className="h-screen flex flex-col bg-white">
                    <header className="p-4 border-b flex items-center gap-4 bg-pastel-green-50">
                        <button onClick={onBack} className="text-pastel-green-600"><Icon name="arrow-left" /></button>
                        <div className="w-10 h-10 rounded-full bg-white"><img src={`https://api.dicebear.com/7.x/avataaars/svg?seed=${person.id}`} alt={person.nome} className="rounded-full" /></div>
                        <div>
                            <h3 className="font-bold">{person.nome}</h3>
                            <p className="text-[10px] text-pastel-green-500 font-bold uppercase tracking-widest flex items-center gap-1">
                                <span className="w-1.5 h-1.5 bg-pastel-green-500 rounded-full animate-pulse"></span> Online
                            </p>
                        </div>
                    </header>
                    <div className="flex-1 overflow-y-auto p-6 space-y-4">
                        {history.map(h => (
                            <div key={h.id} className={`flex ${h.sender === 'me' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[70%] p-4 rounded-3xl text-sm animate_animated animate_fadeInUp ${
                                    h.sender === 'me' ? 'bg-pastel-green-500 text-white rounded-br-none' : 'bg-slate-100 text-slate-700 rounded-bl-none'
                                }`}>
                                    {h.text}
                                </div>
                            </div>
                        ))}
                    </div>
                    <form onSubmit={send} className="p-6 border-t flex gap-4">
                        <input value={msg} onChange={e => setMsg(e.target.value)} className="flex-1 bg-slate-50 border border-slate-100 rounded-2xl px-6 outline-none focus:ring-2 focus:ring-pastel-green-200 transition-all" placeholder="Escreva sua mensagem..." />
                        <button type="submit" className="w-14 h-14 bg-pastel-green-500 text-white rounded-2xl shadow-lg shadow-pastel-green-100 flex items-center justify-center hover:scale-105 transition-all">
                            <Icon name="send" />
                        </button>
                    </form>
                </div>
            );
        }

        function VideoView({ person, formData, usuario, onBack }) {
            const localRef = useRef(null);
            const remoteRef = useRef(null);
            const streamsRef = useRef([]); // guarda as MediaStreams abertas para poder encerrar as tracks
            const [status, setStatus] = useState('idle'); // idle, calling, ringing, connected, error
            const [myId, setMyId] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const peerRef = useRef(null);
            const calledRef = useRef(false); // evita disparar a chamada duas vezes (StrictMode/re-render)

            // Abre a câmera/microfone e devolve a stream, tratando erros num só lugar
            const openLocalStream = async () => {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                streamsRef.current.push(stream);
                localRef.current.srcObject = stream;
                return stream;
            };

            // Liga a chamada automaticamente para o Peer ID da pessoa selecionada,
            // sem precisar de prompt() nem de copiar/colar nenhum código.
            const autoCall = async (peer, targetId) => {
                setStatus('calling');
                try {
                    const stream = await openLocalStream();
                    const call = peer.call(targetId, stream);
                    call.on('stream', rs => { remoteRef.current.srcObject = rs; setStatus('connected'); });
                    call.on('close', () => setStatus('idle'));
                    call.on('error', () => { setErrorMsg('A chamada caiu. Tente novamente.'); setStatus('error'); });
                } catch (e) {
                    setErrorMsg('Não foi possível acessar câmera/microfone.');
                    setStatus('error');
                }
            };

            useEffect(() => {
                const ownId = toPeerId(getOwnId(formData, usuario));
                // ID previsível: registrando o próprio peer com esse ID, quem
                // quiser falar com este usuário sempre sabe para qual ID discar,
                // sem precisar perguntar/copiar nada a cada chamada.
                const peer = new Peer(ownId);
                peerRef.current = peer;

                peer.on('open', id => {
                    setMyId(id);
                    // Dispara a ligação automaticamente assim que o peer está pronto.
                    if (!calledRef.current) {
                        calledRef.current = true;
                        autoCall(peer, toPeerId(person.id));
                    }
                });

                peer.on('call', async call => {
                    setStatus('ringing');
                    try {
                        const stream = await openLocalStream();
                        call.answer(stream); // atende automaticamente, sem confirm()
                        call.on('stream', rs => { remoteRef.current.srcObject = rs; setStatus('connected'); });
                        call.on('close', () => setStatus('idle'));
                    } catch (err) {
                        setErrorMsg('Não foi possível acessar câmera/microfone.');
                        setStatus('error');
                    }
                });

                peer.on('error', (err) => {
                    // ID já em uso (outra aba aberta com o mesmo usuário, por ex.)
                    setErrorMsg('Não foi possível iniciar a chamada: ' + err.type);
                    setStatus('error');
                });

                return () => {
                    // encerra todas as tracks de mídia abertas e destrói a conexão peer
                    streamsRef.current.forEach(s => s.getTracks().forEach(t => t.stop()));
                    peer.destroy();
                };
            }, []);

            const retry = () => {
                calledRef.current = false;
                setErrorMsg('');
                if (peerRef.current && !peerRef.current.destroyed) {
                    autoCall(peerRef.current, toPeerId(person.id));
                    calledRef.current = true;
                }
            };

            const handleBack = () => {
                streamsRef.current.forEach(s => s.getTracks().forEach(t => t.stop()));
                onBack();
            };

            return (
                <div className="h-screen bg-slate-900 relative overflow-hidden flex items-center justify-center text-white">
                    <video ref={remoteRef} autoPlay className="absolute inset-0 w-full h-full object-cover opacity-50" />

                    {status !== 'connected' && (
                        <div className="relative z-10 text-center space-y-6 animate_animated animate_fadeIn">
                            <img src={`https://api.dicebear.com/7.x/avataaars/svg?seed=${person.id}`} alt={person.nome} className="w-32 h-32 rounded-full mx-auto border-4 border-pastel-green-500 shadow-2xl" />
                            <h2 className="text-3xl font-bold">{person.nome}</h2>
                            <p className="text-slate-400">
                                {status === 'calling' && 'Chamando automaticamente via WebRTC...'}
                                {status === 'ringing' && 'Recebendo chamada, conectando...'}
                                {status === 'idle' && 'Preparando conexão...'}
                                {status === 'error' && (errorMsg || 'Não foi possível conectar.')}
                            </p>
                            <div className="bg-white/5 p-4 rounded-2xl border border-white/10">
                                <p className="text-[10px] uppercase font-bold text-slate-500 mb-2">Seu ID de Chamada</p>
                                <code className="text-pastel-green-400 font-mono text-xs">{myId || 'Gerando...'}</code>
                            </div>
                            {status === 'error' && (
                                <button onClick={retry} className="px-6 py-3 bg-pastel-green-500 rounded-2xl font-bold hover:bg-pastel-green-600 transition-all">
                                    Tentar novamente
                                </button>
                            )}
                        </div>
                    )}

                    <div className="absolute top-8 right-8 w-48 aspect-video bg-black rounded-3xl overflow-hidden border-2 border-white/20 shadow-2xl z-20">
                        <video ref={localRef} autoPlay muted className="w-full h-full object-cover" />
                    </div>

                    <div className="absolute bottom-12 flex gap-6 z-30">
                        <button onClick={handleBack} className="w-20 h-20 bg-rose-500 rounded-full flex items-center justify-center shadow-2xl shadow-rose-500/40 hover:scale-110 transition-all">
                            <Icon name="phone-off" className="w-10 h-10" />
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
